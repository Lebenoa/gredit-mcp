[package]
name = "gredit-mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
rmcp = { version = "3.4", features = ["elicitation", "server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
